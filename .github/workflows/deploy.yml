name: Deploy Linform to AWS

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy.yml
      - tests/**
      - infra/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linform-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      S3_BUCKET: linform-website-alexis
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<!doctype html>' index.html
          if [[ ! "$CLOUDFRONT_DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ]]; then
            echo "::error::Set the CLOUDFRONT_DISTRIBUTION_ID repository variable."
            exit 1
          fi

      - name: Check learning platform
        run: |
          node tests/validate-site.mjs
          node --test tests/account-progress.mjs
          node --test tests/terminal.mjs
          node --test tests/terraform.mjs
          python -m unittest discover -s infra -p 'test_*.py' -v

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: LinformGitHubDeploy
          role-duration-seconds: 900

      - name: Upload website
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp index.html "s3://$S3_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public,max-age=0,must-revalidate" \
            --only-show-errors

      - name: Refresh CloudFront cache
        shell: bash
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/" "/index.html" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Deployment summary
        run: |
          echo "Published index.html and completed CloudFront cache refresh." >> "$GITHUB_STEP_SUMMARY"
          echo "Website: https://linformcloud.com" >> "$GITHUB_STEP_SUMMARY"

